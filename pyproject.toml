[project]
name = "epicollect_sync"
authors = [{ name = "Epicollect Sync contributors" }]
description = "Sync Epicollect5 project entries into Frappe"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["requests", "python-dateutil"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 120
